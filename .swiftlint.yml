# SwiftLint configuration — MCP Router
#
# Validated against SwiftLint 0.65.0. Rule names moved between releases, so this file is checked
# by actually running the linter rather than by inheriting a config from another project.

included:
  - app/Sources
  - app/Tests
  - app/MCPRouter
  - app/MCPRouterIOS

excluded:
  - .build
  - DerivedData
  - build
  - node_modules
  - dist
  - .worktrees

line_length:
  warning: 110
  error: 140
  ignores_comments: false
  ignores_urls: true

identifier_name:
  min_length: 1        # `s`, `c`, `r` read fine in a tight parser loop
  excluded: [id, ok, ts, ms]

type_name:
  min_length: 3

function_body_length:
  warning: 60
  error: 100

# Opt-in rules that catch real defects rather than style preferences.
opt_in_rules:
  - force_unwrapping
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_filter_count
  - redundant_nil_coalescing
  - explicit_init
  - closure_spacing
  - collection_alignment
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  - todo                    # tracked in the pipeline's specs, not by the linter
  - trailing_comma          # SwiftFormat owns comma style; two tools fighting is worse than either

# A force unwrap in a test is a deliberate assertion that the value is there; in shipped code it
# is a crash waiting for the one input nobody tried.
force_unwrapping:
  severity: error

analyzer_rules:
  - unused_declaration
  - unused_import
