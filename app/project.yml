name: MCPRouter

options:
  bundleIdPrefix: app.fledgeling
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"

# The shared library lives in the same directory as this file: `Package.swift` sits beside
# `project.yml`, SwiftPM owns the library and its tests, and the two app targets consume it as a
# local package. That keeps `swift test` fast and Xcode-free for everything that does not need a
# UI, while the apps still link one definition of the shared code.
packages:
  MCPRouterKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Deliberately no DEVELOPMENT_TEAM or CODE_SIGN_STYLE here. Setting them in the shared layer
    # forces a signing identity that no developer or CI runner currently has, which fails every
    # build including the ones that never intended to sign. The release posture lives in the
    # Release configuration below and is applied only when signing is actually being done.
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"

targets:
  # ---------------------------------------------------------------- macOS
  MCPRouter:
    type: application
    platform: macOS
    # Explicitly this target's own directory. Pointing an app target at `Sources` would compile
    # the shared library a second time — it is already linked as a package product — and would
    # sweep in anything else that happens to live there.
    sources:
      - path: MCPRouter
    dependencies:
      - package: MCPRouterKit
        product: MCPRouterKit
      # The shared presentation layer. Separate from the kit because `SWIFT_PRACTICES.md` §8
      # requires the kit to stay free of UI frameworks so the router's own tests can import it;
      # both apps link this one so there is a single design system rather than a copy each.
      - package: MCPRouterKit
        product: MCPRouterUI
    info:
      path: MCPRouter/Info.plist
      properties:
        CFBundleName: MCP Router
        CFBundleDisplayName: MCP Router
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "MIT"
        # Not an agent: this app has a real window as well as a menu bar item, so LSUIElement
        # would take away the Dock icon people use to get back to it.
        LSUIElement: false
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: MCPRouter/MCPRouter.entitlements
      properties:
        # Not sandboxed, and this is a distribution decision rather than a shortcut. The app
        # spawns arbitrary MCP subprocesses and rewrites ~/.claude.json — both of which App
        # Sandbox forbids outright — so the Mac App Store was never available to it. It ships
        # Developer ID direct with the hardened runtime on instead.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fledgeling.mcprouter
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication

  # ---------------------------------------------------------------- iOS
  MCPRouterIOS:
    type: application
    platform: iOS
    sources:
      - path: MCPRouterIOS
    dependencies:
      - package: MCPRouterKit
        product: MCPRouterKit
      - package: MCPRouterKit
        product: MCPRouterUI
    info:
      path: MCPRouterIOS/Info.plist
      properties:
        CFBundleName: MCP Router
        CFBundleDisplayName: MCP Router
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Required, and not a formality: `AVCaptureDevice.requestAccess(for: .video)` traps at
        # runtime when this key is absent, so an app that ships without it crashes the first time
        # anyone taps "Allow camera access". The wording states the single narrow use and what does
        # not happen, which is what the pre-prompt surface promises the user.
        NSCameraUsageDescription:
          MCP Router uses the camera once, to read the pairing code shown on your Mac.
          Nothing is recorded.
    # The companion is sandboxed by definition on iOS and currently needs no capability of its
    # own. The file exists but is empty on purpose: a later item adds to a reviewed baseline
    # rather than introducing the first entitlement alongside a feature.
    entitlements:
      path: MCPRouterIOS/MCPRouterIOS.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fledgeling.mcprouter.ios
        TARGETED_DEVICE_FAMILY: "1"

  # ---------------------------------------------------------------- iOS tests
  #
  # A real iOS test target, hosted by the app, and it exists because the alternative is a suite that
  # cannot fail. `MCPRouterUITests` runs on the macOS host: it can prove a view constructs, that its
  # copy comes from the manifest, and that its state machine behaves — but it cannot prove a 44pt
  # touch target on an iPhone, a safe-area inset, a system tab bar, Dynamic Type at an accessibility
  # size, or that the *generated* Info.plist carries the camera purpose string. Asserting any of
  # those on macOS would be a green light for a claim nobody measured.
  #
  # Hosted rather than standalone specifically so `Bundle.main` is the app bundle, which is what
  # makes the Info.plist assertion read the artifact that actually ships.
  MCPRouterIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MCPRouterIOSTests
    dependencies:
      - target: MCPRouterIOS
      - package: MCPRouterKit
        product: MCPRouterKit
      - package: MCPRouterKit
        product: MCPRouterUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fledgeling.mcprouter.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MCPRouterIOS.app/MCPRouterIOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # ---------------------------------------------------------------- iOS on-glass tests
  #
  # A UI-test target, and it exists because `MCPRouterIOSTests` above cannot answer the question
  # the campaign's `ios-glass` lane asks. That target is a *unit* test hosted by the app: it
  # constructs views in the app's process and reads them through a hand-rolled walk of
  # `UIView.accessibilityLabel`. It never taps a tab, so it cannot tell "each tab renders its own
  # surface" from "all five render Settings" — which is precisely the failure `PhoneShell`'s own
  # `switch` comment names as the one worth guarding.
  #
  # XCUITest runs out of process against the installed app on a booted simulator, reads iOS's own
  # accessibility tree rather than a walk of ours, and its screenshots are taken by the runner
  # *after* a named surface assertion passed — which is what makes a capture attributable to a
  # surface instead of being a photograph of whatever was on screen.
  #
  # It never needs Simulator.app. `xcodebuild test` against an already-`simctl boot`ed device
  # drives the runtime directly, so this obeys `planning/practices/UI_VERIFICATION.md` rule 1.
  MCPRouterIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MCPRouterIOSUITests
    dependencies:
      - target: MCPRouterIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fledgeling.mcprouter.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MCPRouterIOS

schemes:
  MCPRouterIOS:
    build:
      targets:
        MCPRouterIOS: all
        MCPRouterIOSTests: [test]
    test:
      targets:
        - MCPRouterIOSTests

  # A separate scheme so `make test-ios` stays the fast in-process suite and the on-glass lane is
  # asked for by name. One scheme carrying both would make every unit run pay for an app install
  # and five tab transitions.
  MCPRouterIOSGlass:
    build:
      targets:
        MCPRouterIOS: all
        MCPRouterIOSUITests: [test]
    test:
      targets:
        - MCPRouterIOSUITests
