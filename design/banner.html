  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0E0D16; }
  .banner {
    width:1280px; height:400px; position:relative; overflow:hidden;
    background:
      radial-gradient(560px 340px at 82% 52%, rgba(255,183,77,.10), transparent 72%),
      radial-gradient(900px 620px at 22% 30%, #2A2839, transparent 72%),
      linear-gradient(160deg, #24222F 0%, #17161F 58%, #100F18 100%);
    display:flex; align-items:center; gap:52px; padding:0 78px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  }
  .banner::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.05), transparent 24%);
    pointer-events:none;
  }
  .icon { width:204px; height:204px; flex:none;
          filter:drop-shadow(0 22px 34px rgba(0,0,0,.62)); }
  .copy { position:relative; z-index:1; }
  h1 { font-size:66px; font-weight:640; letter-spacing:-.028em; color:#EFEDFA; line-height:1; }
  h1 .dim { color:#8B88B4; }
  p  { font-size:22px; font-weight:400; color:#A8A5C6; margin-top:18px; letter-spacing:-.008em; line-height:1.4; max-width:720px; }
  .stats { display:flex; gap:36px; margin-top:30px; }
  .stat { display:flex; align-items:baseline; gap:9px; }
  .stat b { font-size:27px; font-weight:640; letter-spacing:-.02em; color:#FDBB5F; font-variant-numeric:tabular-nums; }
  .stat span { font-size:14px; color:#807DA4; letter-spacing:.01em; }
